name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Everything except backups/ and history/, which hold a ~130 MB
          # private workspace archive that no test reads. Excluding beats
          # listing: a new top-level folder that tests read is picked up.
          sparse-checkout: |
            /*
            !/backups/
            !/history/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # Network tests stay skipped: SIGNALFORGE_NETWORK_TESTS is not set.
        # No secrets are exposed to this job; the suite is hermetic.
        run: python -m pytest
