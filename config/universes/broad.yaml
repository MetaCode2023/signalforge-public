# Broad research universe: every symbol with tiingo bars in the warehouse on 2026-10-29,
# minus the benchmark and the excluded names below. The list is explicit and committed so a
# run is reproducible; it is today's survivors, so it carries survivorship bias, and the
# point-in-time eligibility screen only narrows that, it does not remove it.
#
# No validation or test window lives here: those come from research.yaml splits. Only
# train_start is raised, and it must fall inside the research train window.
name: broad
source: tiingo
benchmark: SPY
load_start: 1992-01-02
train_start: 1993-02-01
max_names: 20
eligibility:
  min_history_sessions: 252
  min_median_dollar_volume: "500000"   # 0.05 cap x 100k cash / 0.01 participation
  dollar_volume_window: 63
